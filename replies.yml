name: Reply to comments

on:
  schedule:
    - cron: "20 3,11,19 * * *"   # three times a day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reply-bot
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python packages
        run: pip install requests google-api-python-client google-auth google-auth-httplib2
      - name: Reply to new comments
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CHANNEL_NAME: "MelodyRush"
          MAX_REPLIES: "8"
        run: python replies.py
      - name: Save reply history
        run: |
          git config user.name "song-bot"
          git config user.email "song-bot@users.noreply.github.com"
          git add data/replies.json || true
          git commit -m "Update reply history" || echo "nothing to commit"
          git pull --rebase || true
          git push || echo "push skipped"
