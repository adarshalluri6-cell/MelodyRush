name: Make and upload song video

on:
  schedule:
    - cron: "30 14 * * *"   # about 10:30 AM New York, uploads about 11 AM
    - cron: "30 20 * * *"   # about  4:30 PM New York, uploads about  5 PM
  workflow_dispatch:
    inputs:
      dry_run:
        description: "TICK = test only (NO upload). UNTICK to upload for real. (Scheduled runs always upload.)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: song-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          mkdir -p fonts
          curl -L -o fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf || true
          curl -L -o fonts/Poppins-ExtraBold.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-ExtraBold.ttf || true
          curl -L -o fonts/Poppins-Bold.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf || true
          curl -L -o fonts/Poppins-Medium.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Medium.ttf || true

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Make the song video
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          CHANNEL_NAME: "MelodyRush"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python main.py

      - name: Save learning data
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "song-bot"
          git config user.email "song-bot@users.noreply.github.com"
          git add data/history.json
          git commit -m "Update performance history" || echo "nothing to commit"
          git push || echo "push skipped"

      - name: Save test files
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            output/video.mp4
            output/thumbnail.jpg
            output/plan.json
            output/description.txt
          retention-days: 3
